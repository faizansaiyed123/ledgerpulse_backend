name: Bootstrap repository

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  restore:
    if: ${{ hashFiles('.bootstrap/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore final source tree
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/*.b64 > /tmp/repository.tgz.xz.b64
          base64 -d /tmp/repository.tgz.xz.b64 > /tmp/repository.tgz.xz
          mkdir -p /tmp/extracted
          tar -xJf /tmp/repository.tgz.xz -C /tmp/extracted

          find . -mindepth 1 -maxdepth 1 \
            ! -name .git \
            ! -name .github \
            ! -name .bootstrap \
            -exec rm -rf {} +

          cp -a /tmp/extracted/. .
          rm -rf .bootstrap
          rm -f .github/workflows/frontend.yml .github/workflows/backend.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: publish completed LedgerPulse application"
          git push origin HEAD:main
